name: Foundation checks

on:
  push:
    branches: [hyx_dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:ad249f9fb9572979643a47694e59b9a8cdcdf6abc6accebf49bb80ad5f20ff9b
        env:
          POSTGRES_DB: vault_ci
          POSTGRES_USER: vault_ci
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U vault_ci -d vault_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VAULT_ENVIRONMENT: test
      VAULT_DATABASE_URL: postgresql+psycopg://vault_ci:ci-ephemeral-only@127.0.0.1:5432/vault_ci
      VAULT_TEST_DATABASE_URL: postgresql+psycopg://vault_ci:ci-ephemeral-only@127.0.0.1:5432/vault_ci
      VAULT_TEST_API_DATABASE_URL: postgresql+psycopg://vault_api:ci-runtime-ephemeral-only@127.0.0.1:5432/vault_ci
      VAULT_TEST_DATABASE_IS_DISPOSABLE: "1"
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.22
          enable-cache: true
      - run: uv sync --frozen --python 3.13.16
      - run: uv run --frozen ruff check .
      - run: uv run --frozen alembic upgrade head
      - name: Create the non-bypass runtime role in CI
        env:
          PGPASSWORD: ci-ephemeral-only
        run: psql -h 127.0.0.1 -U vault_ci -d vault_ci -v ON_ERROR_STOP=1 -f ../../infra/ci_database_roles.sql
      - run: uv run --frozen alembic check
      - run: uv run --frozen pytest -q
      - name: Verify PostgreSQL LangGraph restart recovery
        env:
          PGPASSWORD: ci-ephemeral-only
          VAULT_PG_PROBE_DATABASE_URL: postgresql://vault_ci:ci-ephemeral-only@127.0.0.1:5432/vault_checkpoint_probe
        run: |
          createdb -h 127.0.0.1 -U vault_ci vault_checkpoint_probe
          trap 'dropdb --if-exists --force -h 127.0.0.1 -U vault_ci vault_checkpoint_probe' EXIT
          uv run --frozen python ../../document/technical_validation/langgraph_postgres_probe.py prepare
          uv run --frozen python ../../document/technical_validation/langgraph_postgres_probe.py resume
      - run: uv run --frozen python -m vault_backend.export_openapi --output ../../packages/contracts/openapi.json --check
      - name: Disposable database migration round trip
        run: |
          uv run --frozen alembic downgrade base
          uv run --frozen alembic upgrade head
          uv run --frozen alembic check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: packages/contracts/tooling
      - run: npm run contracts:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:ad249f9fb9572979643a47694e59b9a8cdcdf6abc6accebf49bb80ad5f20ff9b
        env:
          POSTGRES_DB: vault_ci
          POSTGRES_USER: vault_ci
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U vault_ci -d vault_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VAULT_ENVIRONMENT: test
      VAULT_DATABASE_URL: postgresql+psycopg://vault_api:ci-runtime-ephemeral-only@127.0.0.1:5432/vault_ci
      VAULT_AUTH_ENABLED: "1"
      VAULT_MAIL_CAPTURE_DIR: /tmp/vault-mail
      VAULT_E2E_MAIL_CAPTURE_DIR: /tmp/vault-mail
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.22
          enable-cache: true
      - run: uv sync --frozen --python 3.13.16
        working-directory: services/backend
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Migrate the disposable browser database
        working-directory: services/backend
        env:
          VAULT_DATABASE_URL: postgresql+psycopg://vault_ci:ci-ephemeral-only@127.0.0.1:5432/vault_ci
        run: uv run --frozen alembic upgrade head
      - name: Create the restricted browser runtime role
        env:
          PGPASSWORD: ci-ephemeral-only
        run: psql -h 127.0.0.1 -U vault_ci -d vault_ci -v ON_ERROR_STOP=1 -f infra/ci_database_roles.sql
      - name: Start the API with real account storage
        working-directory: services/backend
        run: |
          uv run --frozen python -m vault_backend > /tmp/vault-api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/ready > /dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/vault-api.log
          exit 1
      - run: npm run test:e2e
        working-directory: apps/web
      - name: Verify production app shell after offline restart
        working-directory: apps/web
        run: |
          npm run build
          node ./node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4174 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          npm run test:offline
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: browser-failure-evidence
          path: apps/web/test-results/
          retention-days: 7
